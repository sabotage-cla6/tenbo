<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規対局開始 - TENBO</title>
  <style>
    /* 全体スタイル */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 12px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-top: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* フォームパーツ */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* グリッドレイアウト（2列表示） */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* プレイヤー入力エリア */
    .player-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .player-input-wrap {
      position: relative;
    }

    .player-label {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .player-input-wrap input {
      padding-left: 36px;
    }

    /* チェックボックス・トグル */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* ボタン */
    .btn-submit {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* レスポンシブ対応 */
    @media (max-width: 480px) {
      .player-list, .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>対局設定</h1>

    <form id="game-start-form">
      <!-- 2. ルール設定 -->
      <div class="section-title">⚙️ 対局ルール</div>
      
      <div class="grid-2">
        <div class="form-group">
          <label for="game-type">対局形式</label>
          <select id="game-type" name="gameType">
            <option value="hanchan">半荘戦</option>
            <option value="tonpuu">東風戦</option>
          </select>
        </div>

        <div class="form-group">
          <label for="initial-score">配給原点 (持ち点)</label>
          <select id="initial-score" name="initialScore">
            <option value="25000" selected>25,000 点</option>
            <option value="30000">30,000 点</option>
            <option value="20000">20,000 点</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="return-score">返し点 (基準点)</label>
          <select id="return-score" name="returnScore">
            <option value="30000" selected>30,000 点</option>
            <option value="25000">25,000 点</option>
          </select>
        </div>

        <div class="form-group">
          <label for="uma">ウマ設定</label>
          <select id="uma" name="uma">
            <option value="10-30" selected>ゴトウ (10-30)</option>
            <option value="10-20">ワンツー (10-20)</option>
            <option value="20-30">ワンスリー (20-30)</option>
            <option value="none">なし (0-0)</option>
          </select>
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" name="tobi" checked>
        <span>トビ終了あり（箱割れで即終局）</span>
      </label>

      <!-- 送信ボタン -->
      <button type="submit" class="btn-submit">対局を開始する</button>
    </form>
  </div>

  <script>
    // フォーム送信時のハンドリング例
    document.getElementById('game-start-form').addEventListener('submit', function(e) {
      e.preventDefault();

      // 入力値を取得してオブジェクト化
      const formData = new FormData(this);
      const gameConfig = Object.fromEntries(formData.entries());

      console.log('対局開始データ:', gameConfig);
      alert('対局を開始します！\n（コンソールに設定データが出力されました）');
      
      // 実実装時: ここで対局画面（卓画面）へ遷移させます
      // window.location.href = '/game.html';
    });
  </script>

</body>
</html>
