<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tenbo - 対局準備ロビー画面</title>
  <style>
    :root {
      --bg-color: #09170e;
      --table-bg: radial-gradient(circle, #174028 0%, #0a2114 100%);
      --card-bg: rgba(20, 48, 31, 0.9);
      --card-border: #2c5e3d;
      --accent-gold: #f39c12;
      --accent-gold-light: #f1c40f;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --accent-orange: #e67e22;
      --text-main: #f0f4f1;
      --text-muted: #8e9e94;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    /* App Header */
    header {
      width: 100%;
      max-width: 420px;
      padding: 10px 16px;
      background: rgba(12, 28, 18, 0.98);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 13px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, var(--accent-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Main Frame */
    main {
      width: 100%;
      max-width: 420px;
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 参加プレイヤー設定カード群 */
    .player-setup-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-setup-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .player-info-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wind-badge {
      width: 24px;
      height: 24px;
      background: rgba(255,255,255,0.12);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
    }

    .player-input-name {
      background: #08140c;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      width: 140px;
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon-small {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }

    /* 起家・場決め・起家決めボタンエリア用 */
    .decision-buttons-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-decision {
      padding: 11px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--card-border);
      background: rgba(20, 48, 31, 0.9);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .btn-decision:active {
      transform: scale(0.97);
    }

    /* フッターおよびボタンエリア */
    .lobby-footer {
      width: 100%;
      max-width: 420px;
      padding: 12px 16px;
      background: rgba(12, 28, 18, 0.98);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-start {
      flex: 3;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-gold), #d35400);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
      text-align: center;
    }

    .btn-exit {
      flex: 1;
      padding: 14px 8px;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.4);
      color: #ff7675;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
    }

    .btn-start:active, .btn-exit:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="brand">
      <div class="logo-icon">点</div>
      <div class="brand-name">tenbo</div>
    </div>
    <div class="header-info">対局準備ロビー</div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- 参加プレイヤー設定 -->
    <div>
      <div class="section-title"><span>👥</span> 参加プレイヤー・座席設定</div>
      <div class="player-setup-list">
        <!-- 東家 -->
        <div class="player-setup-card">
          <div class="player-info-group">
            <div class="wind-badge" style="background: var(--accent-orange);">東</div>
            <input type="text" class="player-input-name" value="プレイヤー1 (親)">
          </div>
          <div class="player-actions">
            <button class="btn-icon-small" title="入れ替え">🔄</button>
          </div>
        </div>

        <!-- 南家 -->
        <div class="player-setup-card">
          <div class="player-info-group">
            <div class="wind-badge">南</div>
            <input type="text" class="player-input-name" value="自分">
          </div>
          <div class="player-actions">
            <button class="btn-icon-small" title="入れ替え">🔄</button>
          </div>
        </div>

        <!-- 西家 -->
        <div class="player-setup-card">
          <div class="player-info-group">
            <div class="wind-badge">西</div>
            <input type="text" class="player-input-name" value="プレイヤー3">
          </div>
          <div class="player-actions">
            <button class="btn-icon-small" title="入れ替え">🔄</button>
          </div>
        </div>

        <!-- 北家 -->
        <div class="player-setup-card">
          <div class="player-info-group">
            <div class="wind-badge">北</div>
            <input type="text" class="player-input-name" value="プレイヤー4">
          </div>
          <div class="player-actions">
            <button class="btn-icon-small" title="入れ替え">🔄</button>
          </div>
        </div>
      </div>

      <!-- 起家・場決めボタン および 起家決めボタン -->
      <div class="decision-buttons-container">
        <button class="btn-decision" onclick="alert('起家・場決めを実行します')">
          <span>🎲</span> 起家・場決め
        </button>
        <button class="btn-decision" onclick="alert('起家決めを実行します')">
          <span>🀄</span> 起家決め
        </button>
      </div>
    </div>
  </main>

  <!-- Footer Action (対局を開始するボタンの右に退出ボタンを配置) -->
  <div class="lobby-footer">
    <button class="btn-start" onclick="alert('対局画面へ遷移します')">対局を開始する</button>
    <button class="btn-exit" onclick="alert('ロビーから退出します')"><span>🚪</span> 退出</button>
  </div>

</body>
</html>
