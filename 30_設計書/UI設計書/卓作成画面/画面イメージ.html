<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tenbo - 卓作成画面</title>
  <style>
    :root {
      --bg-color: #09170e;
      --table-bg: radial-gradient(circle, #174028 0%, #0a2114 100%);
      --card-bg: rgba(20, 48, 31, 0.9);
      --card-border: #2c5e3d;
      --accent-gold: #f39c12;
      --accent-gold-light: #f1c40f;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --accent-green: #2ecc71;
      --text-main: #f0f4f1;
      --text-muted: #8e9e94;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 420px;
      padding: 12px 16px;
      background: rgba(12, 28, 18, 0.98);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 13px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, var(--accent-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 420px;
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-title-box {
      text-align: center;
      margin-top: 4px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .page-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Standard Card / Collapsible Group Card */
    .setting-card, details.setting-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }

    .card-label-static {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    summary.card-label {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
    }

    summary.card-label::-webkit-details-marker {
      display: none;
    }

    .summary-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chevron-icon {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    details[open] summary .chevron-icon {
      transform: rotate(180deg);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* Copy Button Specific Style */
    .btn-copy {
      width: 100%;
      padding: 10px 14px;
      background: rgba(243, 156, 18, 0.12);
      border: 1.5px solid var(--accent-gold);
      border-radius: 8px;
      color: var(--accent-gold-light);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-copy:active {
      background: rgba(243, 156, 18, 0.25);
      transform: scale(0.98);
    }

    /* Row Layout (Left: Label, Right: Control) */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .setting-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
    }

    .setting-desc {
      font-size: 10px;
      color: var(--text-muted);
    }

    .setting-control {
      width: 140px;
      display: flex;
      justify-content: flex-end;
    }

    .setting-control.wide {
      width: 180px;
    }

    /* Form Inputs & Controls */
    .text-input-box {
      width: 100%;
      height: 38px;
      background: #050d08;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      text-align: right;
      user-select: text;
      -webkit-user-select: text;
    }

    .text-input-box:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .text-input-box.left-align {
      text-align: left;
    }

    /* Point Input with Unit Badge */
    .input-with-unit {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-with-unit .text-input-box {
      padding-right: 32px;
    }

    .unit-badge {
      position: absolute;
      right: 10px;
      font-size: 11px;
      font-weight: bold;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Segmented Control */
    .segment-control {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      background: #050d08;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      width: 100%;
    }

    .segment-btn {
      padding: 6px 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .segment-btn.active {
      background: var(--accent-gold);
      color: #000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    select {
      width: 100%;
      height: 38px;
      padding: 0 8px;
      border-radius: 8px;
      background: #050d08;
      color: #fff;
      border: 1.5px solid var(--card-border);
      font-size: 12px;
      font-weight: bold;
      text-align: right;
    }

    select:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    /* Custom Box (Uma / Rounding) */
    .custom-expand-box {
      background: #050d08;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-expand-box.hidden {
      display: none;
    }

    .uma-rank-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .uma-rank-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .uma-rank-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: bold;
    }

    .short-input-box {
      width: 100%;
      height: 34px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      user-select: text;
      -webkit-user-select: text;
    }

    .short-input-box:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .short-input-box:disabled {
      opacity: 0.6;
      background: #000;
      cursor: not-allowed;
    }

    /* Custom Rounding Rule Layout */
    .rounding-custom-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
    }

    .rounding-custom-row input {
      width: 50px;
    }

    /* CSS Switch */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .2s;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #000;
    }

    /* Action Buttons Container */
    .action-buttons-box {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    /* Action Buttons */
    .btn-submit {
      flex: 2;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-gold), #d35400);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-home {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-home:active {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo-icon">点</div>
      <div class="brand-name">tenbo</div>
    </div>
    <button class="btn-close">✕</button>
  </header>

  <!-- Main Content -->
  <main>

    <div class="page-title-box">
      <div class="page-title">新規卓の作成</div>
      <div class="page-sub">ルールを設定して対局ルームを作成します</div>
    </div>

    <!-- 基本設定カード -->
    <details class="setting-card" open>
      <summary class="card-label">
        <span class="summary-title">📝 基本情報設定</span>
        <span class="chevron-icon">▼</span>
      </summary>
      <div class="card-body">
        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">卓の名称</span>
            <span class="setting-desc">参加者に表示される名前</span>
          </div>
          <div class="setting-control wide">
            <input type="text" class="text-input-box left-align" value="金曜夜セット麻雀" placeholder="例: たなか卓">
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">パスコード</span>
            <span class="setting-desc">入室用(任意・4桁)</span>
          </div>
          <div class="setting-control">
            <input type="password" class="text-input-box" placeholder="なし" maxlength="4">
          </div>
        </div>
      </div>
    </details>

    <!-- 既存卓コピー セクション -->
    <div class="setting-card">
      <div class="card-label-static">
        <span class="summary-title">📋 既存卓情報コピー</span>
      </div>
      <div class="card-body" style="margin-top: 10px;">
        <button class="btn-copy">
          <span>既存の卓から設定を読み込む</span>
        </button>
      </div>
    </div>

    <!-- 対局形式カード -->
    <details class="setting-card" open>
      <summary class="card-label">
        <span class="summary-title">🀄 対局形式</span>
        <span class="chevron-icon">▼</span>
      </summary>
      <div class="card-body">
        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">人数設定</span>
          </div>
          <div class="setting-control wide">
            <div class="segment-control">
              <button class="segment-btn active">四人麻雀</button>
              <button class="segment-btn">三人麻雀</button>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">配給原点</span>
          </div>
          <div class="setting-control">
            <select>
              <option>25,000点</option>
              <option>26,000点</option>
              <option>30,000点</option>
              <option>35,000点</option>
            </select>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">返し点</span>
          </div>
          <div class="setting-control">
            <select>
              <option>30,000点</option>
              <option>25,000点</option>
              <option>40,000点</option>
            </select>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">ウマ</span>
          </div>
          <div class="setting-control">
            <select id="uma-select" onchange="toggleCustomUma()">
              <option value="10-30">10 - 30</option>
              <option value="10-20">10 - 20</option>
              <option value="5-10">5 - 10</option>
              <option value="none">なし</option>
              <option value="custom">その他</option>
            </select>
          </div>
        </div>

        <!-- ウマ：その他選択時の詳細設定フォーム -->
        <div id="custom-uma-container" class="custom-expand-box hidden">
          <div class="setting-desc">1着〜4着のウマ(pt)を直接指定</div>
          <div class="uma-rank-grid">
            <div class="uma-rank-item">
              <span class="uma-rank-label">1着</span>
              <input type="number" class="short-input-box" value="30" placeholder="+30">
            </div>
            <div class="uma-rank-item">
              <span class="uma-rank-label">2着</span>
              <input type="number" class="short-input-box" value="10" placeholder="+10">
            </div>
            <div class="uma-rank-item">
              <span class="uma-rank-label">3着</span>
              <input type="number" class="short-input-box" value="-10" placeholder="-10">
            </div>
            <div class="uma-rank-item">
              <span class="uma-rank-label">4着</span>
              <input type="number" class="short-input-box" value="-30" placeholder="-30">
            </div>
          </div>
        </div>
      </div>
    </details>

    <!-- 積み棒設定カード -->
    <details class="setting-card" open>
      <summary class="card-label">
        <span class="summary-title">🥢 積み棒設定</span>
        <span class="chevron-icon">▼</span>
      </summary>
      <div class="card-body">
        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">点数</span>
            <span class="setting-desc">1本あたりの加算点</span>
          </div>
          <div class="setting-control">
            <div class="input-with-unit">
              <input type="number" class="text-input-box" value="300" placeholder="300" step="100">
              <span class="unit-badge">点</span>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">複数ロン時</span>
            <span class="setting-desc">ダブロン等の積み棒分配</span>
          </div>
          <div class="setting-control">
            <select>
              <option value="head-bump">頭ハネ</option>
              <option value="all">全員</option>
            </select>
          </div>
        </div>
      </div>
    </details>

    <!-- 精算設定カード -->
    <details class="setting-card" open>
      <summary class="card-label">
        <span class="summary-title">🧮 精算設定</span>
        <span class="chevron-icon">▼</span>
      </summary>
      <div class="card-body">
        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">箱下精算</span>
            <span class="setting-desc">マイナス分も精算に反映</span>
          </div>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">飛び賞</span>
          </div>
          <div class="setting-control">
            <div class="input-with-unit">
              <input type="number" class="text-input-box" value="10" placeholder="0">
              <span class="unit-badge">pt</span>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">焼き鳥</span>
          </div>
          <div class="setting-control">
            <div class="input-with-unit">
              <input type="number" class="text-input-box" value="10" placeholder="0">
              <span class="unit-badge">pt</span>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">
            <span class="setting-title">端数処理</span>
            <span class="setting-desc">ポイント計算時の丸め方式</span>
          </div>
          <div class="setting-control">
            <select id="rounding-select" onchange="toggleCustomRounding()">
              <option value="round">四捨五入</option>
              <option value="5cut6in">五捨六入</option>
              <option value="none">丸めなし (小数あり)</option>
              <option value="ceil">切り上げ</option>
              <option value="floor">切り捨て</option>
              <option value="custom">その他</option>
            </select>
          </div>
        </div>

        <!-- 端数処理：その他選択時の詳細設定フォーム -->
        <div id="custom-rounding-container" class="custom-expand-box hidden">
          <div class="setting-desc">「捨」の数字を入力すると「入」が自動計算されます</div>
          <div class="rounding-custom-row">
            <input type="number" id="cut-val" class="short-input-box" value="5" min="0" max="8" oninput="autoCalculateIn()">
            <span>捨</span>
            <input type="number" id="in-val" class="short-input-box" value="6" disabled>
            <span>入</span>
          </div>
        </div>

      </div>
    </details>

    <!-- アクションボタンエリア -->
    <div class="action-buttons-box">
      <button class="btn-home">
        <span>🏠 ホーム</span>
      </button>
      <button class="btn-submit">
        <span>✨ 卓を作成して部屋に入る</span>
      </button>
    </div>

  </main>

  <script>
    function toggleCustomUma() {
      const select = document.getElementById('uma-select');
      const customContainer = document.getElementById('custom-uma-container');
      if (select.value === 'custom') {
        customContainer.classList.remove('hidden');
      } else {
        customContainer.classList.add('hidden');
      }
    }

    function toggleCustomRounding() {
      const select = document.getElementById('rounding-select');
      const customContainer = document.getElementById('custom-rounding-container');
      if (select.value === 'custom') {
        customContainer.classList.remove('hidden');
      } else {
        customContainer.classList.add('hidden');
      }
    }

    function autoCalculateIn() {
      const cutInput = document.getElementById('cut-val');
      const inInput = document.getElementById('in-val');
      const cutVal = parseInt(cutInput.value, 10);

      if (!isNaN(cutVal) && cutVal >= 0 && cutVal <= 8) {
        inInput.value = cutVal + 1;
      } else if (cutInput.value === '') {
        inInput.value = '';
      }
    }
  </script>

</body>
</html>
