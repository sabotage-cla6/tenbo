<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tenbo - ログイン</title>
  <style>
    :root {
      --bg-color: #09170e;
      --card-bg: rgba(20, 48, 31, 0.9);
      --card-border: #2c5e3d;
      --accent-gold: #f39c12;
      --accent-gold-light: #f1c40f;
      --accent-green: #2ecc71;
      --accent-green-dark: #1e8449;
      --text-main: #f0f4f1;
      --text-muted: #8e9e94;
      --input-bg: #08140c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* App Header (ブランド表示) */
    header {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(243, 156, 18, 0.3);
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--accent-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Main Content Container */
    main {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .forgot-link {
      font-size: 11px;
      color: var(--accent-gold-light);
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--input-bg);
      color: #fff;
      border: 1.5px solid var(--card-border);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 8px rgba(243, 156, 18, 0.3);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Options (ログイン状態の保持) */
    .options-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 20px 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .options-group input[type="checkbox"] {
      accent-color: var(--accent-gold);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Action Buttons */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(135deg, var(--accent-gold), #d35400);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(243, 156, 18, 0.2);
    }

    /* Footer Links */
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .auth-footer a {
      color: var(--accent-gold-light);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="brand">
      <div class="logo-icon">点</div>
      <div class="brand-name">tenbo</div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    <div class="login-card">
      <h1 class="card-title">ログイン</h1>
      <p class="card-subtitle">登録済みのアカウント情報でサインイン</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- メールアドレス -->
        <div class="form-group">
          <div class="label-row">
            <label for="email">メールアドレス</label>
          </div>
          <input type="email" id="email" placeholder="example@tenbo.app" required>
        </div>

        <!-- パスワード -->
        <div class="form-group">
          <div class="label-row">
            <label for="password">パスワード</label>
            <a href="#" class="forgot-link" onclick="alert('パスワード再設定画面へ遷移します')">お忘れですか？</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="パスワードを入力" required>
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" aria-label="パスワードの表示切替">
              <span id="pwdIcon">👁️</span>
            </button>
          </div>
        </div>

        <!-- ログイン保持 -->
        <div class="options-group">
          <input type="checkbox" id="remember" checked>
          <label for="remember" style="font-weight: normal; cursor: pointer;">
            ログイン状態を保持する
          </label>
        </div>

        <!-- ログインボタン -->
        <button type="submit" class="btn-submit">
          <span>⚡ 対局をはじめる (ログイン)</span>
        </button>
      </form>

      <!-- 新規登録への誘導 -->
      <div class="auth-footer">
        アカウントをお持ちでないですか？
        <a href="#" onclick="alert('サインアップ画面へ遷移します')">新規登録</a>
      </div>
    </div>
  </main>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const pwdIcon = document.getElementById('pwdIcon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.innerText = '🙈';
      } else {
        pwdInput.type = 'password';
        pwdIcon.innerText = '👁️';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;

      // ログイン処理のシミュレーション
      alert(`ログインしました！\n\nメールアドレス: ${email}`);
    }
  </script>
</body>
</html>
