<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天棒 - 新規アカウント登録</title>
  <style>
    :root {
      --card-bg: rgba(20, 48, 31, 0.9);
      --card-border: #2C5E3D;
      --accent-gold: #F39C12;
      --accent-gold-light: #F1C40F;
      --accent-green-dark: #1E8449;
      --accent-green-light: #27AE60;
      --text-muted: #8E9E94;
      --input-bg: #08140C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #07100a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(243, 156, 18, 0.3);
    }

    .app-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff, var(--accent-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Card */
    .signup-card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.54);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .input-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
    }

    .input-tag {
      font-size: 10px;
      color: var(--accent-gold);
      background-color: rgba(243, 156, 18, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      height: 44px;
      background-color: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input::placeholder {
      color: #4A5D52;
      font-size: 14px;
    }

    .form-input:focus {
      border-color: var(--accent-gold);
    }

    /* Checkbox Row */
    .terms-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .terms-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .terms-text a {
      color: var(--accent-gold-light);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-green-light), var(--accent-green-dark));
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* Footer */
    .footer-text {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent-gold-light);
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- App Header -->
    <header class="app-header">
      <div class="logo-badge">天</div>
      <h1 class="app-title">天棒</h1>
    </header>

    <!-- Signup Card -->
    <main class="signup-card">
      <h2 class="card-title">新規アカウント登録</h2>
      <p class="card-subtitle">対局データやスコアの管理をはじめましょう</p>

      <form onsubmit="event.preventDefault();">
        <!-- プレイヤー名 -->
        <div class="form-group">
          <div class="label-row">
            <label class="input-label" for="username">プレイヤー名</label>
            <span class="input-tag">いつでも変更可能です</span>
          </div>
          <input type="text" id="username" class="form-input" maxlength="12" placeholder="例: 点棒 太郎">
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <div class="label-row">
            <label class="input-label" for="email">メールアドレス</label>
          </div>
          <input type="email" id="email" class="form-input" placeholder="例: example@tenbo.com">
        </div>

        <!-- パスワード -->
        <div class="form-group">
          <div class="label-row">
            <label class="input-label" for="password">パスワード</label>
          </div>
          <input type="password" id="password" class="form-input" placeholder="8文字以上の半角英数字">
        </div>

        <!-- 利用規約の同意 -->
        <div class="terms-row">
          <input type="checkbox" id="terms" class="checkbox">
          <label for="terms" class="terms-text">
            <a onclick="alert('利用規約を表示します')">利用規約</a> と 
            <a onclick="alert('プライバシーポリシーを表示します')">プライバシーポリシー</a> に同意する
          </label>
        </div>

        <!-- 登録ボタン -->
        <button type="submit" class="submit-btn">
          <span>🀄</span>
          <span>アカウントを作成する</span>
        </button>

        <!-- ログインへの誘導 -->
        <p class="footer-text">
          すでにアカウントをお持ちですか？ <a onclick="alert('ログイン画面へ遷移します')">ログイン</a>
        </p>
      </form>
    </main>
  </div>

</body>
</html>
